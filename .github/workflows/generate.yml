name: generate

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # STATS_TOKEN is optional. Without it only public contributions are counted.
      - name: stats
        run: mkdir -p dist && node scripts/stats.mjs ${{ github.repository_owner }} dist/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ffb7c5&color_dots=#1d1542,#4a2d6e,#7d4f9e,#c77dbb,#ffb7c5
            dist/snake-light.svg?color_snake=#e0568a&color_dots=#f3eefa,#e3d4f5,#c9a8e8,#e98bb5,#e0568a

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
