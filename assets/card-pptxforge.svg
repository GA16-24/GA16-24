<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 230" width="490" height="230">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity="0.3"/></pattern>
    <radialGradient id="bg" cx="80%" cy="40%" r="90%"><stop offset="0" stop-color="#0c1a10"/><stop offset="1" stop-color="#040806"/></radialGradient>
    <clipPath id="c"><rect width="490" height="230" rx="16"/></clipPath>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; }
    .name { font-size: 24px; font-weight: 800; fill: #39ff88; }
    .desc { font-size: 13px; fill: #8dffb9; }
    .meta { font-size: 11px; fill: #2f8a50; letter-spacing: 2px; }
    .tag { font-size: 11px; fill: #39ff88; }
    .chip { fill: none; stroke: #1d4a28; }
    .deck { transform: translate(410px, 70px); }
    .s { animation: deal 6s cubic-bezier(.6,0,.3,1) infinite; opacity: 0; }
    @keyframes deal {
      0% { transform: translate(40px, 30px) rotate(12deg) scale(.7); opacity: 0; }
      12% { opacity: 1; }
      25% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
      50% { transform: translate(-22px, -14px) rotate(-8deg) scale(.9); opacity: .6; }
      75% { transform: translate(-40px, -26px) rotate(-16deg) scale(.8); opacity: .25; }
      100% { transform: translate(-56px, -36px) rotate(-22deg) scale(.7); opacity: 0; }
    }
  </style>
  <g clip-path="url(#c)">
    <rect width="490" height="230" fill="url(#bg)"/>
    <g><g class="deck" filter="url(#glow)"><g class="s" style="animation-delay:0.0s">
        <rect x="-50" y="-30" width="100" height="60" rx="4" fill="#07120a" stroke="#39ff88" stroke-width="1.5"/>
        <rect x="-38" y="-18" width="40" height="6" rx="2" fill="#39ff88"/>
        <rect x="-38" y="-4" width="60" height="3" rx="1.5" fill="#2f8a50"/>
        <rect x="-38" y="4" width="48" height="3" rx="1.5" fill="#2f8a50"/>
        <circle cx="30" cy="14" r="6" fill="none" stroke="#8dffb9" stroke-width="1.2"/>
      </g><g class="s" style="animation-delay:-1.5s">
        <rect x="-50" y="-30" width="100" height="60" rx="4" fill="#07120a" stroke="#39ff88" stroke-width="1.5"/>
        <rect x="-38" y="-18" width="48" height="6" rx="2" fill="#39ff88"/>
        <rect x="-38" y="-4" width="60" height="3" rx="1.5" fill="#2f8a50"/>
        <rect x="-38" y="4" width="48" height="3" rx="1.5" fill="#2f8a50"/>
        <circle cx="30" cy="14" r="8" fill="none" stroke="#8dffb9" stroke-width="1.2"/>
      </g><g class="s" style="animation-delay:-3.0s">
        <rect x="-50" y="-30" width="100" height="60" rx="4" fill="#07120a" stroke="#39ff88" stroke-width="1.5"/>
        <rect x="-38" y="-18" width="56" height="6" rx="2" fill="#39ff88"/>
        <rect x="-38" y="-4" width="60" height="3" rx="1.5" fill="#2f8a50"/>
        <rect x="-38" y="4" width="48" height="3" rx="1.5" fill="#2f8a50"/>
        <circle cx="30" cy="14" r="10" fill="none" stroke="#8dffb9" stroke-width="1.2"/>
      </g><g class="s" style="animation-delay:-4.5s">
        <rect x="-50" y="-30" width="100" height="60" rx="4" fill="#07120a" stroke="#39ff88" stroke-width="1.5"/>
        <rect x="-38" y="-18" width="64" height="6" rx="2" fill="#39ff88"/>
        <rect x="-38" y="-4" width="60" height="3" rx="1.5" fill="#2f8a50"/>
        <rect x="-38" y="4" width="48" height="3" rx="1.5" fill="#2f8a50"/>
        <circle cx="30" cy="14" r="12" fill="none" stroke="#8dffb9" stroke-width="1.2"/>
      </g></g></g>
    <text x="26" y="36" class="meta">PROJECT 01 · PUBLIC</text>
    <text x="26" y="68" class="name" filter="url(#glow)">pptxforge</text>
    <text x="26" y="94" class="desc">PowerPoint decks from Python.</text>
    <text x="26" y="113" class="desc">Themed layouts, native 3D models</text>
    <text x="26" y="132" class="desc">that morph between slides and</text>
    <text x="26" y="151" class="desc">cinematic transitions.</text>
    <rect x="26" y="176" width="60" height="24" rx="12" class="chip"/><text x="35" y="192" class="tag">python</text><rect x="94" y="176" width="46" height="24" rx="12" class="chip"/><text x="103" y="192" class="tag">pptx</text><rect x="148" y="176" width="32" height="24" rx="12" class="chip"/><text x="157" y="192" class="tag">3d</text><rect x="188" y="176" width="46" height="24" rx="12" class="chip"/><text x="197" y="192" class="tag">pypi</text>
    <rect width="490" height="230" fill="url(#scan)"/>
  </g>
  <rect x="1" y="1" width="488" height="228" rx="15" fill="none" stroke="#1d4a28" stroke-width="2"/>
</svg>
