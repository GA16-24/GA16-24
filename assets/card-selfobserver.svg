<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 230" width="490" height="230">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity="0.3"/></pattern>
    <radialGradient id="bg" cx="80%" cy="40%" r="90%"><stop offset="0" stop-color="#0c1a10"/><stop offset="1" stop-color="#040806"/></radialGradient>
    <clipPath id="c"><rect width="490" height="230" rx="16"/></clipPath>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; }
    .name { font-size: 24px; font-weight: 800; fill: #39ff88; }
    .desc { font-size: 13px; fill: #8dffb9; }
    .meta { font-size: 11px; fill: #2f8a50; letter-spacing: 2px; }
    .tag { font-size: 11px; fill: #39ff88; }
    .chip { fill: none; stroke: #1d4a28; }
    .ring { fill: none; stroke: #1d4a28; stroke-width: 1; }
    .sweep { transform-origin: 410px 80px; animation: spin 4s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blip { fill: #d8ffe6; opacity: 0; animation: ping 4s ease-out infinite; }
    @keyframes ping { 0% { opacity: 1; } 60% { opacity: 0; } 100% { opacity: 0; } }
  </style>
  <g clip-path="url(#c)">
    <rect width="490" height="230" fill="url(#bg)"/>
    <g><circle cx="410" cy="80" r="60" class="ring"/><circle cx="410" cy="80" r="40" class="ring"/><circle cx="410" cy="80" r="20" class="ring"/>
      <line x1="350" y1="80" x2="470" y2="80" class="ring"/><line x1="410" y1="20" x2="410" y2="140" class="ring"/>
      <defs><linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#39ff88" stop-opacity="0"/><stop offset="1" stop-color="#39ff88" stop-opacity="0.5"/></linearGradient></defs>
      <g class="sweep"><path d="M410 80 L470 80 A60 60 0 0 0 452.4 37.6 Z" fill="url(#sw)"/><line x1="410" y1="80" x2="470" y2="80" stroke="#39ff88" stroke-width="2" filter="url(#glow)"/></g>
      <circle cx="438" cy="58" r="3" class="blip" style="animation-delay:0.4s"/><circle cx="376" cy="90" r="3" class="blip" style="animation-delay:1.6s"/><circle cx="422" cy="118" r="3" class="blip" style="animation-delay:2.5s"/><circle cx="392" cy="40" r="3" class="blip" style="animation-delay:3.3s"/><circle cx="454" cy="100" r="3" class="blip" style="animation-delay:1.1s"/></g>
    <text x="26" y="36" class="meta">PROJECT 02 · PUBLIC</text>
    <text x="26" y="68" class="name" filter="url(#glow)">SelfObserver</text>
    <text x="26" y="94" class="desc">Local activity tracker. Window</text>
    <text x="26" y="113" class="desc">titles and screenshots go through</text>
    <text x="26" y="132" class="desc">local Ollama models and come out as</text>
    <text x="26" y="151" class="desc">a timeline, a forecast and notes.</text>
    <rect x="26" y="176" width="60" height="24" rx="12" class="chip"/><text x="35" y="192" class="tag">python</text><rect x="94" y="176" width="60" height="24" rx="12" class="chip"/><text x="103" y="192" class="tag">ollama</text><rect x="162" y="176" width="53" height="24" rx="12" class="chip"/><text x="171" y="192" class="tag">flask</text><rect x="223" y="176" width="67" height="24" rx="12" class="chip"/><text x="232" y="192" class="tag">hdbscan</text>
    <rect width="490" height="230" fill="url(#scan)"/>
  </g>
  <rect x="1" y="1" width="488" height="228" rx="15" fill="none" stroke="#1d4a28" stroke-width="2"/>
</svg>
